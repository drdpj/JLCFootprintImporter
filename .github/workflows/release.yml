name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      REPO_URL: https://raw.githubusercontent.com/${{ github.repository }}/pcm-repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Tag must match the metadata version
        run: |
          version=$(python -c "import json;print(json.load(open('packaging/metadata.json'))['versions'][0]['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != metadata version v$version"; exit 1; }
      - name: Fetch the existing PCM repository branch (if any)
        run: git clone --branch pcm-repository --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" pcm-repo || mkdir pcm-repo
      - name: Build PCM archive and repository files
        run: python tools/build_pcm.py --repo-dir pcm-repo --repo-url "$REPO_URL"
      - name: Validate archive
        run: python -m kipy.packaging validate dist/*.zip
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/metadata-repository.json --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Publish PCM repository branch
        run: |
          cd pcm-repo
          if [ ! -d .git ]; then git init -q -b pcm-repository && git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "Publish ${GITHUB_REF_NAME}"
          git push origin HEAD:pcm-repository
